<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fe3ff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#0b6d8a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#05141c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#0f3a48" stroke-width="0.6"/>
    </pattern>
    <style>
      .spin  { transform-origin: 160px 130px; animation: r 18s linear infinite; }
      .spinr { transform-origin: 160px 130px; animation: r 26s linear infinite reverse; }
      @keyframes r { to { transform: rotate(360deg); } }
      .blink { animation: b 2.4s ease-in-out infinite; }
      @keyframes b { 50% { opacity: .35; } }
    </style>
  </defs>

  <rect width="1200" height="260" fill="#05141c"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <rect x="6" y="6" width="1188" height="248" fill="none" stroke="#1d6f86" stroke-width="1.5"/>
  <path d="M6 40V6H60M1140 6H1194V40M1194 220V254H1140M60 254H6V220" fill="none" stroke="#ff8a1f" stroke-width="3"/>

  <!-- Núcleo HUD -->
  <circle cx="160" cy="130" r="105" fill="url(#glow)"/>
  <circle cx="160" cy="130" r="92" fill="none" stroke="#1d8fb0" stroke-width="1" stroke-dasharray="2 6"/>
  <g class="spin">
    <circle cx="160" cy="130" r="80" fill="none" stroke="#4fe3ff" stroke-width="5" stroke-dasharray="70 40 20 40"/>
  </g>
  <g class="spinr">
    <circle cx="160" cy="130" r="64" fill="none" stroke="#ff8a1f" stroke-width="3" stroke-dasharray="30 70"/>
  </g>
  <circle cx="160" cy="130" r="48" fill="#071f2a" stroke="#4fe3ff" stroke-width="2"/>
  <circle cx="160" cy="130" r="20" fill="#bff6ff" class="blink"/>

  <!-- Título -->
  <text x="300" y="118" fill="#4fe3ff" font-family="Orbitron, 'Segoe UI', Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="18">J.A.R.V.I.S</text>
  <text x="304" y="158" fill="#7fb8c8" font-family="Consolas, 'Courier New', monospace" font-size="18" letter-spacing="6">SISTEMA PESSOAL // NEXO</text>
  <text x="304" y="196" fill="#ff8a1f" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="4">IA CLAUDE + GEMINI + DEEPSEEK + OLLAMA · CÉREBRO · VOZ · HUD</text>

  <!-- Status -->
  <rect x="980" y="40" width="170" height="34" fill="none" stroke="#2ee59d" stroke-width="1.5"/>
  <circle cx="1000" cy="57" r="5" fill="#2ee59d" class="blink"/>
  <text x="1014" y="63" fill="#2ee59d" font-family="Consolas, monospace" font-size="16" letter-spacing="4">LIGADO</text>
  <text x="1150" y="225" fill="#1d8fb0" font-family="Consolas, monospace" font-size="12" text-anchor="end" letter-spacing="3">ÀS SUAS ORDENS</text>
</svg>
